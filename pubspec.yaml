name: bkknex_health_app
description: AI Health & Wellness Companion — Phase 0/1 (Flutter + Supabase).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.6.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  intl: ^0.19.0
  http: ^1.2.2
  posthog_flutter: ^5.50.0
  sentry_flutter: ^9.30.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  in_app_purchase: ^3.3.1
  google_mobile_ads: ^9.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# Config for `dart run flutter_launcher_icons` — regenerates the Android
# launcher icon mipmaps under android/app/src/main/res/, which (like the
# rest of android/) is gitignored and regenerated by `flutter create`. Must
# be re-run after every `flutter create`, same as scripts/patch_android_*.sh
# — see scripts/generate_launcher_icons.sh.
#
# adaptive_icon_background is required, not cosmetic: on API 26+, Android
# applies its own "legacy icon" adaptive treatment to any icon that has no
# real adaptive resources — it insets/shrinks the flat PNG and pads the
# revealed gap with a system default background (white), regardless of
# what color fills the flat PNG itself. That's what "small icon with a
# white background" after install was, on a real device, not a flaw in the
# PNG. Providing an explicit adaptive background color makes that gap the
# same blue instead, foreground uses the same full-bleed image so even the
# inset/mask never reveals anything else.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0249fe"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
